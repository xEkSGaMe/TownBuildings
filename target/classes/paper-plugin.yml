name: TownBuildings
version: '1.0.0-SNAPSHOT'
main: ru.example.townbuildings.TownBuildingsPlugin
api-version: '1.21'
authors: [EksGame]
description: Городские постройки, склады и хранилища для Towny.
website: https://example.ru
folia-supported: false

dependencies:
  server:
    Towny:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true