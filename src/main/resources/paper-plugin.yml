name: CloudCore
version: '${project.version}'
main: ru.example.cloudcore.CloudCorePlugin
api-version: '1.21'
authors: [EksGame]
description: All-in-one Towny addon — buildings, wonders, warehouses, religions, forms, ideologies.
website: https://example.ru
folia-supported: false

dependencies:
  server:
    Towny:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    TownyWar:
      load: BEFORE
      required: false
      join-classpath: true