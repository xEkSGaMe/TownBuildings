# =====================================================
#  TownBuildings — основной конфиг
# =====================================================

# Режим отладки: подробные логи в консоль
debug: false

# Язык сообщений (файл messages_<lang>.yml, сейчас поддерживается только ru)
language: ru

database:
  host: "127.0.0.1"
  port: 3306
  name: "townbuildings"
  user: "root"
  password: "changeme"

  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    io-threads: 4
    connection-timeout-ms: 5000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    properties:
      useSSL: false
      characterEncoding: "utf8"
      serverTimezone: "UTC"
      rewriteBatchedStatements: true

cache:
  town-ttl-seconds: 600
  warmup-on-start: true

sessions:
  save-debounce-ticks: 40
  session-ttl-seconds: 300

tracking:
  block-place-ttl-minutes: 60

effects:
  permanent-refresh-seconds: 6
  permanent-duration-seconds: 30

training-camp:
  fuse-ticks: 80

online-tracking:
  tick-interval-seconds: 60
  reward-threshold-seconds: 3600
  batch-flush-seconds: 30
  max-hours-per-batch: 24

# ★ Экономика (замкнутая экономика через towny-server)
economy:
  # Использовать системный аккаунт towny-server для транзакций CloudCore:
  #   • расход на здания/чудеса:  town → towny-server
  #   • награды городу/игроку:    towny-server → town/player
  #     (если на towny-server не хватает — награда НЕ выдаётся, тихо,
  #      накопленные часы возвращаются в пул)
  # При false — плагин работает по-старому (только town / player аккаунты).
  use-server-account: true

features:
  buildings: true
  inventory: true
  stock: true
  bonuses: true
  effects: true
  admin-commands: true
  library-exp: true
  training-camp-tnt: true
  tax-office: true
  topographic-institute: true
  headquarters-stacking: true
  university-perms: true
  wonders: true
  holy-sites: true

# =====================================================
#  ★ Скидки через LuckPerms-пермишены
# =====================================================
# Скидка применяется к игроку, который нажал кнопку апгрейда/постройки.
# Если игрок offline / null — скидки нет (полная цена).
#
# Каждый tier — отдельный пермишен. Если у игрока несколько — берётся
# МАКСИМУМ по coinsPercent и отдельно МАКСИМУМ по itemsPercent
# (можно выдавать независимые скидки на монеты и на ресурсы).
#
# Админ-операции (admin wonders give / admin buildings give) — БЕЗ скидки.
discounts:
  enabled: true
  tiers:
    warden:
      permission: "townbuildings.discount.warden"
      coins-percent: 5.0
      items-percent: 5.0
    gladiator:
      permission: "townbuildings.discount.gladiator"
      coins-percent: 10.0
      items-percent: 10.0
    knight:
      permission: "townbuildings.discount.knight"
      coins-percent: 15.0
      items-percent: 15.0
    prince:
      permission: "townbuildings.discount.prince"
      coins-percent: 20.0
      items-percent: 20.0
    king:
      permission: "townbuildings.discount.king"
      coins-percent: 25.0
      items-percent: 25.0
    cloud:
      permission: "townbuildings.discount.cloud"
      coins-percent: 35.0
      items-percent: 35.0
