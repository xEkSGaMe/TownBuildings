# ===========================================================================
#  TownBuildings — Чудеса Света
#
#  Семь Чудес Света (SACRED) идут по порядку, слоты 10..16.
#  Ниже — не-Сакральные (Нотч, Эйфель, Ласточкино), слоты 30/32/34.
#
#  В lore доступен плейсхолдер {icon-color} — подставляется color текущего
#  чуда. Все строки начинаются с <!italic> — курсив отключён.
#
#  Награды:
#    rewards.*              — стандартные поля (см. BuildingRewards).
#    timed-items            — предметы раз в N часов; формат:
#                             - { item: MATERIAL, amount: N, period-hours: H }
# ===========================================================================

rarities:
  ANCIENT:
    display-name: "Древняя"
    color: "<#d97706>"
    grad-from: "#d97706"
    grad-to: "#78350f"
  MAGNIFICENT:
    display-name: "Величественная"
    color: "<#a78bfa>"
    grad-from: "#a78bfa"
    grad-to: "#7c3aed"
  SACRED:
    display-name: "Сакральная"
    color: "<#fbbf24>"
    grad-from: "#fbbf24"
    grad-to: "#f59e0b"
  SEASONAL:
    display-name: "Сезонная"
    color: "<#34d399>"
    grad-from: "#34d399"
    grad-to: "#059669"

base-slots: 1

