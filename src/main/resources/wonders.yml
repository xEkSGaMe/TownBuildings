    color: "<#d97706>"
    grad-from: "#d97706"
    grad-to: "#78350f"
  MAGNIFICENT:
    display-name: "Величественная"
    color: "<#a78bfa>"
    grad-from: "#a78bfa"
    grad-to: "#7c3aed"
  SACRED:
    display-name: "Сакральная"
