# ===========================================================================
#  TownBuildings — Священные места
#
#  Одно Священное место на город. В отличие от Чудес Света:
#    • не требуется цена в монетах/ресурсах — нужен свиток;
#    • в городе должна быть выбрана определённая религия (поле religion).
#
#  Тип свитка задаётся полем scroll:
#    MYSTERY (по умолчанию) — «Таинственный Свиток» (FLOW_BANNER_PATTERN);
#    ANCIENT              — «Древний Свиток» (MOJANG_BANNER_PATTERN).
#  Свиток — физический предмет с подписью в NBT.
#  Выдаётся администратором: /tadmin holyscroll <player> <site> [amount]
#
#  Награды:
#    rewards.*        — стандартные поля BuildingRewards (монеты, чанки,
#                        слоты чудес, опыт, сток и т.д.).
#    timed-items      — предметы раз в N минут:
#                       - { item: MATERIAL, amount: N, period-minutes: M }
#    bonuses.*        — особые боевые/бытовые эффекты (см. ниже).
#    lore/history     — оформление в меню; доступен {icon-color}.
#
#  ВАЖНО: scroll-secret создаётся автоматически при первом запуске и
#  подписывает свитки. Не меняйте его вручную без необходимости — старые
#  свитки перестанут приниматься.
# ===========================================================================

