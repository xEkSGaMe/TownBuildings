  special-icon:
    main:                "<!italic><gray>[</gray>{icon-color}{icon-symbol}<gray>]</gray> <gradient:{grad-from}:{grad-to}><bold>{name}</bold></gradient>"
    short-description:   "<!italic>{icon-color}<bold>|</bold> <gray>{short-desc}"
