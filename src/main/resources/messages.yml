wonders:
  menu-title: "<!italic><gradient:#a78bfa:#7c3aed><bold>Чудеса Света</bold></gradient> <gray>• <white>{town}"

  header: "<!italic><gray>[</gray>{icon-color}{icon-symbol}<gray>]</gray> <gradient:{grad-from}:{grad-to}><bold>{name}</bold></gradient>"

  lore:
    rarity-label:         "<!italic><gray>Редкость: {rarity}"
    built-in:             "<!italic><gray>Построено в: <dark_aqua>{town}"
