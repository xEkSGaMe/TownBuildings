  back-button-lore:  "<!italic><gray>Вернуться в главное меню"

  nav:
    back-active: "<!italic><gradient:#f7b733:#fc4a1a>← Назад"
    back-inactive: "<!italic><gray>← Назад"
    back-lore: "<!italic><gray>Страница <white>{page}<gray>/<white>{pages}"
    forward-active: "<!italic><gradient:#f7b733:#fc4a1a>Вперёд →"
    forward-inactive: "<!italic><gray>Вперёд →"
    forward-lore: "<!italic><gray>Страница <white>{page}<gray>/<white>{pages}"

  branch-icon:
    main: "<!italic><gray>[{color}{icon-symbol}<gray>] <gradient:{grad-from}:{grad-to}><bold>{branch}</bold></gradient>"
    short-description: "<!italic>{color}<bold>|</bold> <gray>{short-desc}"
    hint-inv: "<!italic><bold><red>[!]</red></bold> <white>Храните необходимые ресурсы в <yellow>/t inv"
