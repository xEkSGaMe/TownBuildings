  main-title: "<!italic><gradient:#0885FB:#18D9F5><bold>Постройки</bold></gradient> <gray>• <white>{town}"
  branch-title: "<!italic><gradient:{grad-from}:{grad-to}><bold>{branch}</bold></gradient> <gray>• <white>{town}"

  back-button-left:  "<!italic><gradient:#f7b733:#fc4a1a>← Назад"
