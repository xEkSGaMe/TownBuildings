# ===========================================================================
#  TownBuildings — описания зданий
#  branch:        ECONOMY | MILITARY | TECH | MANAGEMENT | PRODUCTION
#  icon:          Material (Bukkit)
#  in-development: true → улучшение запрещено, но стоимость показывается
#  levels.<n>:
#    bonus-lore:  строки MiniMessage (отображаются в lore иконки)
#    cost-coins:  монеты с казны (по умолчанию 0)
#    cost-items:  Map<Material, Integer> (по умолчанию пусто)
#    rewards:                                  # необязательно
#      town-coins-per-hour: <long>             # монеты в казну города
#      citizen-coins-per-hour: <long>          # монеты каждому горожанину онлайн
#      stock-items-per-hour: { MATERIAL: n }   # ресурсы в /t stock
#      town-chunks-bonus: <int>                # + к лимиту чанков города
#      tax-reduction-percent: <double>
#      exp-bonus-percent: <double>
#      harvest-bonus-percent: <double>
#      mint-income-bonus-percent: <double>     # +% к доходу монетных дворов
#
#      # --- TownyWar integration (soft) ---
#      townywar-starting-points: <long>        # + стартовые очки войны (кумулятивно)
#      townywar-max-flags-bonus: <int>         # + одновременных флагов (кумулятивно)
#      townywar-kill-points-multiplier: <double> # множитель за убийство (max по уровням)
# ===========================================================================

