# ╔══════════════════════════════════════════════════════════════╗
# ║                    И Н С Т И Т У Т Ы  (CloudCore)           ║
# ║          Religions, Government Forms, Ideologies              ║
# ║   ★ 5b: системные сообщения — в messages.yml (institutes.*)   ║
# ╚══════════════════════════════════════════════════════════════╝

permissions:
  node:   "institutes.open"
  bypass: "institutes.admin"

# ──────────────────────────────────────────────────────────────
#  НАСТРОЙКИ
# ──────────────────────────────────────────────────────────────
settings:
  # Общие
  change-cost-levels:     45
  autosave-minutes:       5            # зарезервировано (playtime flush раз в минуту, конфиг для совместимости)
  health-bonus-hearts:    2
  glow-duration-seconds:  8
  glow-interval-seconds:  6

  # Форма правления — экономика
  monarchy-coins-per-hour:     3
  monarchy-citizen-tax:        1
  monarchy-chunk-bonus:        50
  dictatorship-coins-per-hour: 2
  oligarchy-coins-per-hour:    2
  form-check-interval-seconds: 60

  # Теократия
  theocracy-town-income-per-hour: 3

  # Сердца на своей территории
  republic-hearts:       1
  dictatorship-hearts:  -1

  # Интервалы тиков религий (в секундах)
  fast-tick-seconds:      5
  hindu-tick-seconds:     60
  buddhism-tick-seconds:  60
  confucian-tick-seconds: 5

  # Элитные группы
  elite-group-warden:    "warden"
  elite-group-gladiator: "gladiator"
  elite-group-knight:    "knight"

  # Урон и сопротивление
  orthodox-damage:                     1.03
  orthodox-damage-elite:               1.04
  confucian-damage-reduction:          0.90
  confucian-resistance-level:          0
  confucian-resistance-required-level: 30

# ══════════════════════════════════════════════════════════════
#  РЕЛИГИИ
# ══════════════════════════════════════════════════════════════
religions:

  orthodox:
    display:  "&f☦ Православие"
    material: WHITE_DYE
    lore:
      - "&7От берегов Босфора, из куполов Святой Софии,"
      - "&7вера пришла на земли северных славян"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fСвечение &e8 сек &fкаждые &e6 сек"
      - " &7• &fХлеб: &a+4 голода&f, &a+8 насыщения"
      - " &7• &a+3% &fк наносимому урону"
      - " &7• &6WARDEN&f+: &a+4% &fк урону"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &fТорт, тыквенный пирог и печенье"
      - "&f   не восстанавливают голод и насыщение"

  catholic:
    display:  "&f✝ Католицизм"
    material: LIGHT_GRAY_DYE
    lore:
      - "&7Из Рима, от престола Святого Петра,"
      - "&7вера распространилась по всему Западу"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+75 &fк лимиту чанков города"
      - " &7• &fКрестовый поход: убийство мусульманина"
      - "&f   лечит на &c3 сердца"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &fСырая/жареная баранина и крольчатина"
      - "&f   не восстанавливают голод"
      - " &7• &c-2 монеты &fв час с горожанина"

  protestant:
    display:  "&f✞ Протестантизм"
    material: GRAY_DYE
    lore:
      - "&7В XVI веке Лютер прибил к дверям церкви"
      - "&7свои тезисы — и Европа раскололась"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fСкорость II и Спешка II постоянно"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &c-1 монета &fв час из казны города"

  islam:
    display:  "&a☪ Ислам"
    material: GREEN_DYE
    lore:
      - "&7В VII веке на Аравийском полуострове"
      - "&7пророк услышал слово единого Бога"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+2 сердца &fна своей территории"
      - " &7• &6GLADIATOR&f+: Регенерация I (&e15 сек&f) при убийстве игрока"
      - " &7• &6WARDEN&f+: при смерти оставляет ТНТ (не ломает блоки)"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &fСырая/жареная свинина и любые зелья"
      - "&f   дают Иссушение II на &e20 сек"

  hinduism:
    display:  "&6ॐ Индуизм"
    material: ORANGE_DYE
    lore:
      - "&7Древнейшая живая традиция Индии,"
      - "&7вплетённая в берега Ганга и Веды"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fНасыщение I на &e1 сек &fраз в минуту"
      - " &7• &a+50 &fк лимиту чанков города"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &fГовядина (сырая/стейк): Голод III (&e5 сек&f)"
      - " &7• &fУбийство игрока: Иссушение I (&e5 сек&f), кроме WARDEN+"

  buddhism:
    display:  "&e☸ Буддизм"
    material: YELLOW_DYE
    lore:
      - "&7Под деревом Бодхи Сиддхартха Гаутама"
      - "&7прозрел — и мир узнал о срединном пути"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+1 сердце &fна своей территории"
      - " &7• &fРегенерация I (&e4 сек&f) раз в минуту"
      - " &7• &6WARDEN&f+: Регенерация II (&e4 сек&f) раз в минуту"

  judaism:
    display:  "&b✡ Иудаизм"
    material: LIGHT_BLUE_DYE
    lore:
      - "&7Завет с единым Богом, заключённый"
      - "&7в пустыне у горы Синай"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &7(Скоро будет добавлено)"

  confucianism:
    display:  "&c☯ Конфуцианство"
    material: RED_DYE
    lore:
      - "&7Кун-цзы учил гармонии, ритуалу"
      - "&7и порядку — и Китай слушал две тысячи лет"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+25% &fк получаемому опыту"
      - " &7• &6KNIGHT&f+ и уровень опыта &e30&f+: Сопротивление I"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &c-10% &fк урону по игрокам"

# ══════════════════════════════════════════════════════════════
#  ФОРМЫ ПРАВЛЕНИЯ
# ══════════════════════════════════════════════════════════════
forms:

  monarchy:
    display:  "&6♛ Монархия"
    material: GOLDEN_HELMET
    lore:
      - "&7«Государство — это я»"
      - "&8— Людовик XIV"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+50 &fк лимиту чанков города"
      - " &7• &fМэру &e3 монеты &fза час онлайна"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &fКаждый горожанин теряет &e1 монету &fв час"

  republic:
    display:  "&6⚖ Республика"
    material: SHIELD
    lore:
      - "&7«Народ, который забывает о своём прошлом,"
      - "&7обречён пережить его вновь»"
      - "&8— Марк Туллий Цицерон"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &a+1 сердце &fна своей территории"

  dictatorship:
    display:  "&4☠ Диктатура"
    material: IRON_SWORD
    lore:
      - "&7«Власть не дают — власть берут»"
      - "&8— Гай Юлий Цезарь"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fМэру &e2 монеты &fза час онлайна"
      - ""
      - "&c✖ &cШтрафы:"
      - " &7• &c-1 сердце &fна своей территории"

  oligarchy:
    display:  "&5⚜ Олигархия"
    material: DIAMOND
    lore:
      - "&7«Не народ правит, а те, у кого золото»"
      - "&8— Аристотель"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fМэр и ассистенты получают &e2 монеты &fза час онлайна"

  theocracy:
    display:  "&b✟ Теократия"
    material: ENCHANTED_BOOK
    lore:
      - "&7«Всякая власть — от Бога»"
      - "&8— Апостол Павел"
      - ""
      - "&6✦ &eБонусы:"
      - " &7• &fБесплатная смена религии"
      - " &7• &fКазна города получает &e3 монеты &fв час,"
      - "&f   если онлайн есть горожанин"

