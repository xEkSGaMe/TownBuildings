# ╔══════════════════════════════════════════════════════════════╗
# ║                    И Н С Т И Т У Т Ы  (CloudCore)           ║
# ║          Religions, Government Forms, Ideologies              ║
# ║   ★ 5b: системные сообщения — в messages.yml (institutes.*)   ║
# ║   ★ Оформление: symbol/color/grad-* + history/bonuses/penalties║
# ╚══════════════════════════════════════════════════════════════╝

permissions:
  node:   "institutes.open"
  bypass: "institutes.admin"

# ──────────────────────────────────────────────────────────────
#  НАСТРОЙКИ
# ──────────────────────────────────────────────────────────────
settings:
  # Общие
  change-cost-levels:     45
  autosave-minutes:       5            # зарезервировано (playtime flush раз в минуту, конфиг для совместимости)
  health-bonus-hearts:    2
  glow-duration-seconds:  8
  glow-interval-seconds:  6

  # Форма правления — экономика
  monarchy-coins-per-hour:     3
  monarchy-citizen-tax:        1
  monarchy-chunk-bonus:        50
  dictatorship-coins-per-hour: 2
  oligarchy-coins-per-hour:    2
  form-check-interval-seconds: 60

  # Теократия
  theocracy-town-income-per-hour: 3

  # Сердца на своей территории
  republic-hearts:       1
  dictatorship-hearts:  -1

  # Интервалы тиков религий (в секундах)
  fast-tick-seconds:      5
  hindu-tick-seconds:     60
  buddhism-tick-seconds:  60
  confucian-tick-seconds: 5

  # Элитные группы
  elite-group-warden:    "warden"
  elite-group-gladiator: "gladiator"
  elite-group-knight:    "knight"

  # Урон и сопротивление
  orthodox-damage:                     1.03
  orthodox-damage-elite:               1.04
  confucian-damage-reduction:          0.90
  confucian-resistance-level:          0
  confucian-resistance-required-level: 30

# ══════════════════════════════════════════════════════════════
#  РЕЛИГИИ
# ══════════════════════════════════════════════════════════════
religions:

  orthodox:
    display: "Православие"
    symbol: "☦"
    color: "#f5d76e"
    grad-from: "#f5d76e"
    grad-to: "#b8860b"
    material: WHITE_DYE
    history:
      - "От берегов Босфора, из куполов Святой Софии,"
      - "вера пришла на земли северных славян."
    bonuses:
      - "Свечение 8 сек каждые 6 сек"
      - "Хлеб: +4 голода, +8 насыщения"
      - "+3% к наносимому урону"
      - "<gradient:#1b9007:#37a400><bold>WARDEN+</bold></gradient>: +4% к урону"
    penalties:
      - "Торт, тыквенный пирог и печенье"
      - "не восстанавливают голод и насыщение"

  catholic:
    display: "Католицизм"
    symbol: "✝"
    color: "#93c5fd"
    grad-from: "#bfdbfe"
    grad-to: "#3b82f6"
    material: LIGHT_GRAY_DYE
    history:
      - "Из Рима, от престола Святого Петра,"
      - "вера распространилась по всему Западу."
    bonuses:
      - "+75 к лимиту чанков города"
      - "Крестовый поход: убийство мусульманина"
      - "лечит на 3 сердца"
    penalties:
      - "Сырая/жареная баранина и крольчатина"
      - "не восстанавливают голод"
      - "-2 монеты в час с горожанина"

  protestant:
    display: "Протестантизм"
    symbol: "✞"
    color: "#a5b4fc"
    grad-from: "#c7d2fe"
    grad-to: "#6366f1"
    material: GRAY_DYE
    history:
      - "В XVI веке Лютер прибил к дверям церкви"
      - "свои тезисы — и Европа раскололась."
    bonuses:
      - "Скорость II и Спешка II постоянно"
    penalties:
      - "-1 монета в час из казны города"

  islam:
    display: "Ислам"
    symbol: "☪"
    color: "#4ade80"
    grad-from: "#86efac"
    grad-to: "#16a34a"
    material: GREEN_DYE
    history:
      - "В VII веке на Аравийском полуострове"
      - "пророк услышал слово единого Бога."
    bonuses:
      - "+2 сердца на своей территории"
      - "<gradient:#eaec00:#e6df27><bold>GLADIATOR+</bold></gradient>: Регенерация I (15 сек)"
      - "при убийстве игрока"
      - "<gradient:#1b9007:#37a400><bold>WARDEN+</bold></gradient>: при смерти оставляет ТНТ"
      - "(не ломает блоки)"
    penalties:
      - "Сырая/жареная свинина и любые зелья"
      - "дают Иссушение II на 20 сек"

  hinduism:
    display: "Индуизм"
    symbol: "ॐ"
    color: "#fb923c"
    grad-from: "#fdba74"
    grad-to: "#ea580c"
    material: ORANGE_DYE
    history:
      - "Древнейшая живая традиция Индии,"
      - "вплетённая в берега Ганга и Веды."
    bonuses:
      - "Насыщение I на 1 сек раз в минуту"
      - "+50 к лимиту чанков города"
    penalties:
      - "Говядина (сырая/стейк): Голод III (5 сек)"
      - "Убийство игрока: Иссушение I (5 сек),"
      - "кроме <gradient:#1b9007:#37a400><bold>WARDEN+</bold></gradient>"

  buddhism:
    display: "Буддизм"
    symbol: "☸"
    color: "#facc15"
    grad-from: "#fde047"
    grad-to: "#ca8a04"
    material: YELLOW_DYE
    history:
      - "Под деревом Бодхи Сиддхартха Гаутама"
      - "прозрел — и мир узнал о срединном пути."
    bonuses:
      - "+1 сердце на своей территории"
      - "Регенерация I (4 сек) раз в минуту"
      - "<gradient:#1b9007:#37a400><bold>WARDEN+</bold></gradient>: Регенерация II (4 сек)"
      - "раз в минуту"
    penalties: []

  judaism:
    display: "Иудаизм"
    symbol: "✡"
    color: "#60a5fa"
    grad-from: "#93c5fd"
    grad-to: "#2563eb"
    material: LIGHT_BLUE_DYE
    history:
      - "Завет с единым Богом, заключённый"
      - "в пустыне у горы Синай."
    bonuses:
      - "Скоро будет добавлено"
    penalties: []

  confucianism:
    display: "Конфуцианство"
    symbol: "☯"
    color: "#f87171"
    grad-from: "#fca5a5"
    grad-to: "#dc2626"
    material: RED_DYE
    history:
      - "Кун-цзы учил гармонии, ритуалу"
      - "и порядку — и Китай слушал две тысячи лет."
    bonuses:
      - "+25% к получаемому опыту"
      - "<gradient:#ec930e:#e96302><bold>KNIGHT+</bold></gradient> и уровень опыта 30+:"
      - "Сопротивление I"
    penalties:
      - "-10% к урону по игрокам"

# ══════════════════════════════════════════════════════════════
#  ФОРМЫ ПРАВЛЕНИЯ
# ══════════════════════════════════════════════════════════════
forms:

  monarchy:
    display: "Монархия"
    symbol: "♛"
    color: "#fbbf24"
    grad-from: "#fde68a"
    grad-to: "#d97706"
    material: GOLDEN_HELMET
    history:
      - "«Государство — это я»"
      - "— Людовик XIV"
    bonuses:
      - "+50 к лимиту чанков города"
      - "Мэру 3 монеты за час онлайна"
    penalties:
      - "Каждый горожанин теряет 1 монету в час"

  republic:
    display: "Республика"
    symbol: "⚖"
    color: "#38bdf8"
    grad-from: "#7dd3fc"
    grad-to: "#0284c7"
    material: SHIELD
    history:
      - "«Народ, который забывает о своём прошлом,"
      - "обречён пережить его вновь»"
      - "— Марк Туллий Цицерон"
    bonuses:
      - "+1 сердце на своей территории"
    penalties: []

  dictatorship:
    display: "Диктатура"
    symbol: "☠"
    color: "#ef4444"
    grad-from: "#f87171"
    grad-to: "#b91c1c"
    material: IRON_SWORD
    history:
      - "«Власть не дают — власть берут»"
      - "— Гай Юлий Цезарь"
    bonuses:
      - "Мэру 2 монеты за час онлайна"
    penalties:
      - "-1 сердце на своей территории"

  oligarchy:
    display: "Олигархия"
    symbol: "⚜"
    color: "#c084fc"
    grad-from: "#d8b4fe"
    grad-to: "#7e22ce"
    material: DIAMOND
    history:
      - "«Не народ правит, а те, у кого золото»"
      - "— Аристотель"
    bonuses:
      - "Мэр и ассистенты получают 2 монеты"
      - "за час онлайна"
    penalties: []

  theocracy:
    display: "Теократия"
    symbol: "✟"
    color: "#f9a8d4"
    grad-from: "#fbcfe8"
    grad-to: "#db2777"
    material: ENCHANTED_BOOK
    history:
      - "«Всякая власть — от Бога»"
      - "— Апостол Павел"
    bonuses:
      - "Бесплатная смена религии"
      - "Казна города получает 3 монеты в час,"
      - "если онлайн есть горожанин"
    penalties: []

